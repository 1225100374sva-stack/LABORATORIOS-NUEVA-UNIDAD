# ci.yml - Pipeline CI/CD de U4ACT03 (DevOps con Python y GitHub Actions)
# Autor: Sebastian Villegas Arredondo
#
# Se activa con cada push a la rama main.
#   job "test":   descarga el código, instala Python 3.12 y pytest, y corre las pruebas.
#   job "deploy": simula el despliegue a producción. Por "needs: test" solo
#                 arranca si el job de pruebas terminó con check verde.
# Los comandos "run" se ejecutan dentro de la carpeta U4ACT03-DevOps-Python,
# porque el repositorio también guarda las actividades anteriores.

name: CI del validador de correos

on:
  push:
    branches: [ main ]

defaults:
  run:
    working-directory: U4ACT03-DevOps-Python

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar pruebas
        run: pytest -v

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Simular despliegue a producción
        run: |
          echo "Desplegando a producción..."
          echo "Versión lista para usar."
